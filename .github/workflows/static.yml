name: Deploy Mi Tienda to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          # Buscamos el lock file dentro de la subcarpeta
          cache-dependency-path: mi-tienda/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./mi-tienda

      - name: Build project
        run: npm run build
        working-directory: ./mi-tienda

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Subimos la carpeta dist que está dentro de mi-tienda
          path: ./mi-tienda/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4